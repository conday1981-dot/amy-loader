name: Build A.M.Y Loader (Windows)

# Builds the Windows installer on GitHub (the Celeron laptop is far too slow to
# compile the Rust engine). Every push to main produces a downloadable artifact;
# publishing a GitHub release also attaches the installer to that release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-amy-loader-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-amy-loader-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun i --frozen-lockfile

      # The Rust cache restores src-tauri/target, including old installers;
      # clear them so only this build's installer gets uploaded.
      - name: Clean old bundles
        run: bunx rimraf src-tauri/target/release/bundle

      - name: Build installer (A.M.Y config layered over iloader's)
        run: bunx tauri build --config src-tauri/amy.conf.json --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: amy-loader-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Rolling "latest" pre-release: always holds the newest main build, so the
      # installer is one stable link (and the future A.M.Y update feed source).
      - name: Publish rolling "latest" pre-release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest "$($exe.FullName)" --prerelease --target "${{ github.sha }}" `
            --title "Latest build ($('${{ github.sha }}'.Substring(0,7)))" `
            --notes "Newest A.M.Y Loader build from main. Windows installer, installs for the current user (no admin needed)."

      - name: Attach installer to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          gh release upload "${{ github.event.release.tag_name }}" "$($exe.FullName)" --clobber
